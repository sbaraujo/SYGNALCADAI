<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <!-- Bucket pouring water on fire -->
  <g transform="translate(48, 48)">
    <!-- Tilted Bucket -->
    <g transform="rotate(35 45 45)">
      <polygon points="20,10 65,10 55,60 30,60" fill="#111111"/>
      <rect x="40" y="-12" width="6" height="24" rx="2" fill="#111111"/>
    </g>
    <!-- Water drops -->
    <circle cx="68" cy="74" r="3.5" fill="#111111"/>
    <circle cx="60" cy="85" r="4.5" fill="#111111"/>
    <circle cx="76" cy="92" r="4" fill="#111111"/>
    <!-- Flames on ground -->
    <path d="M60 115 C45 105 45 90 60 78 C75 90 75 105 60 115 Z" fill="#111111"/>
    <rect x="25" y="114" width="70" height="5" fill="#111111"/>
  </g>
  <!-- Red Ring and Slash -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#d31a24" stroke-width="18"/>
  <line x1="42" y1="42" x2="158" y2="158" stroke="#d31a24" stroke-width="18" stroke-linecap="round"/>
</svg>
