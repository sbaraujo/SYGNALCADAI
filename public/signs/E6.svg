<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#d31a24" rx="4"/>
  <!-- Hose Reel / Mangotinho -->
  <g fill="#ffffff">
    <!-- Vertical coiled lines of reel -->
    <rect x="42" y="62" width="10" height="80" rx="5"/>
    <rect x="58" y="62" width="10" height="80" rx="5"/>
    <rect x="74" y="62" width="10" height="80" rx="5"/>
    <rect x="90" y="62" width="10" height="80" rx="5"/>
    <rect x="106" y="62" width="10" height="80" rx="5"/>
    <!-- Downward hose with nozzle -->
    <rect x="46" y="140" width="8" height="26" rx="2"/>
    <polygon points="44,166 56,166 54,178 46,178"/>
    <!-- Valve on Right -->
    <rect x="116" y="100" width="22" height="6"/>
    <circle cx="144" cy="103" r="16" fill="none" stroke="#ffffff" stroke-width="6"/>
    <line x1="144" y1="87" x2="144" y2="119" stroke="#ffffff" stroke-width="5"/>
    <line x1="128" y1="103" x2="160" y2="103" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
