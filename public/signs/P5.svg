<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <!-- Obstacles (Wooden Boxes / Pallet) -->
  <g transform="translate(50, 68)">
    <rect x="0" y="0" width="100" height="60" fill="none" stroke="#111111" stroke-width="7"/>
    <line x1="0" y1="20" x2="100" y2="20" stroke="#111111" stroke-width="5"/>
    <line x1="0" y1="40" x2="100" y2="40" stroke="#111111" stroke-width="5"/>
    <!-- Vertical slats -->
    <rect x="20" y="-8" width="10" height="76" fill="#111111"/>
    <rect x="70" y="-8" width="10" height="76" fill="#111111"/>
  </g>
  <!-- Red Ring and Slash -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#d31a24" stroke-width="18"/>
  <line x1="42" y1="42" x2="158" y2="158" stroke="#d31a24" stroke-width="18" stroke-linecap="round"/>
</svg>
