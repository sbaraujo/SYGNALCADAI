    <polygon points="0,-82 22,-36 78,-54 44,-8 82,18 32,32 46,80 0,48 -46,80 -32,32 -82,18 -44,-8 -78,-54 -22,-36" fill="#ffffff"/>
    <polygon points="0,-64 16,-28 62,-42 34,-6 64,14 24,24 36,62 0,38 -36,62 -24,24 -64,14 -34,-6 -62,-42 -16,-28" fill="#1b4d2e"/>
    <!-- Fist Clenching Horizontal Glass Bar -->
    <rect x="-65" y="-12" width="130" height="24" rx="3" fill="#ffffff"/>
    <path d="M -30 -24 L 25 -24 C 32 -24 35 -18 35 -10 L 35 15 C 35 25 28 30 18 32 L -12 32 C -22 32 -28 26 -30 18 Z" fill="#1b4d2e"/>
