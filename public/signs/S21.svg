    <rect x="-24" y="-22" width="10" height="36" rx="4" fill="#ffffff"/>
    <rect x="-12" y="-24" width="10" height="38" rx="4" fill="#ffffff"/>
    <rect x="0" y="-24" width="10" height="38" rx="4" fill="#ffffff"/>
    <rect x="12" y="-22" width="10" height="36" rx="4" fill="#ffffff"/>
