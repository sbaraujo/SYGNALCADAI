<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <polygon points="150,14 286,242 14,242" fill="#fbe106" stroke="#111111" stroke-width="26" stroke-linejoin="round"/>
