<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#d31a24" rx="4"/>
  <!-- Wheeled Extinguisher (Carreta de Incêndio) -->
  <g fill="#ffffff">
    <!-- Long Pull Handle on Left -->
    <line x1="52" y1="30" x2="68" y2="150" stroke="#ffffff" stroke-width="7"/>
    <!-- Cylindrical Tank -->
    <rect x="68" y="58" width="38" height="96" rx="12"/>
    <!-- Top Valve -->
    <rect x="80" y="44" width="12" height="14"/>
    <path d="M80 44 L98 40 L98 48 Z"/>
    <!-- Wheel and base foot -->
    <circle cx="66" cy="156" r="18" fill="#d31a24" stroke="#ffffff" stroke-width="7"/>
    <rect x="94" y="154" width="8" height="18" rx="2"/>
    <!-- Hose Reel on Right side of tank -->
    <rect x="108" y="68" width="16" height="54" rx="4" fill="none" stroke="#ffffff" stroke-width="5"/>
    <line x1="112" y1="74" x2="120" y2="74" stroke="#ffffff" stroke-width="4"/>
    <line x1="112" y1="84" x2="120" y2="84" stroke="#ffffff" stroke-width="4"/>
    <line x1="112" y1="94" x2="120" y2="94" stroke="#ffffff" stroke-width="4"/>
    <line x1="112" y1="104" x2="120" y2="104" stroke="#ffffff" stroke-width="4"/>
    <line x1="112" y1="114" x2="120" y2="114" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
