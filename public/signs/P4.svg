<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <!-- Elevator with fire -->
  <g transform="translate(68, 52)">
    <!-- Elevator Car -->
    <rect x="15" y="30" width="60" height="72" rx="4" fill="none" stroke="#111111" stroke-width="8"/>
    <!-- Two people inside -->
    <circle cx="34" cy="48" r="6" fill="#111111"/>
    <path d="M26 66 L42 66 L38 90 L30 90 Z" fill="#111111"/>
    <circle cx="56" cy="48" r="6" fill="#111111"/>
    <path d="M48 66 L64 66 L60 90 L52 90 Z" fill="#111111"/>
    <!-- Up/Down Arrows on top -->
    <polygon points="34,14 26,24 42,24" fill="#111111"/>
    <polygon points="56,24 48,14 64,14" fill="#111111"/>
    <!-- Flames on Left side -->
    <path d="M-8 65 C-18 52 -18 36 -8 24 C2 36 2 52 -8 65 Z" fill="#111111"/>
    <path d="M-2 85 C-12 72 -12 56 -2 44 C8 56 8 72 -2 85 Z" fill="#111111"/>
  </g>
  <!-- Red Ring and Slash -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#d31a24" stroke-width="18"/>
  <line x1="42" y1="42" x2="158" y2="158" stroke="#d31a24" stroke-width="18" stroke-linecap="round"/>
</svg>
